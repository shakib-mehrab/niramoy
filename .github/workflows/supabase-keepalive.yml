# Backup keep-alive for the free Supabase project (it pauses after 7 days with no activity).
# The app itself pings daily (KeepAliveWorker); this covers weeks when nobody opens it.
# Note: GitHub turns off scheduled workflows after 60 days without repository activity;
# re-enable it from the Actions tab if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail -sS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
